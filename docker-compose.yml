services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velos
      POSTGRES_USER: velos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velos -d velos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://velos:${DB_PASSWORD}@db:5432/velos
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
